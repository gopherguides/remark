name: Tests

on:
  workflow_dispatch:

jobs:
  test:
    name: Test Go ${{matrix.go-version}} on ${{matrix.os}}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        go-version: ['1.24.x']
        os: [ubuntu-latest, macos-latest, windows-latest]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        cache-dependency-path: go.sum
    
    - name: Verify Go version
      run: go version
    
    - name: Download dependencies
      run: go mod download
    
    - name: Verify dependencies
      run: go mod verify
    
    - name: Run tests
      run: go test -race . ./cmd/remark ./cmd/retoc ./htm ./md
    
    - name: Check formatting
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "Code is not formatted. Please run 'gofmt -s -w .'"
          gofmt -s -l .
          exit 1
        fi
      if: runner.os != 'Windows'
    
    - name: Run go vet
      run: go vet ./...
    
    - name: Generate coverage report
      run: |
        mkdir -p .coverage
        go test -coverprofile=.coverage/coverage.out . ./cmd/remark ./cmd/retoc ./htm ./md
      if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.24.x'
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./.coverage/coverage.out
        flags: unittests
        name: codecov-umbrella
      if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.24.x'


